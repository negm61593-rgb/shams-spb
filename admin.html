<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  
  <title id="pageTitle">لوحة إدارة قائمة الطعام • شمس СПб</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  
  <!-- PWA & Mobile Fullscreen Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Шамс Меню" />
  <meta name="theme-color" content="#0c0a09" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- FontAwesome 6 Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="dishes.js"></script>
  <!-- Firebase App & Cloud Firestore SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            stone: {
              950: '#0c0a09',
              900: '#1c1917',
              850: '#231f1c',
              800: '#292524',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            arabic: ['"Cairo"', 'system-ui', 'sans-serif'],
          },
          screens: {
            'xs': '380px',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #0c0a09;
      color: #fafaf9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-height: 100vh;
      min-height: 100dvh;
    }
    body[dir="rtl"] {
      font-family: 'Cairo', system-ui, sans-serif;
    }
    .pb-safe {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 16px));
    }
    .pt-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top, 16px));
    }
    .glass-panel {
      background: rgba(28, 25, 23, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.15);
    }
    .glass-card {
      background: rgba(28, 25, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(245, 158, 11, 0.35);
      transform: translateY(-2px);
    }
    /* Prevent iOS auto-zoom on input focus while keeping sharp typography */
    @media screen and (max-width: 768px) {
      input[type="text"],
      input[type="number"],
      input[type="password"],
      input[type="search"],
      textarea,
      select {
        font-size: 16px !important;
      }
    }
    /* Momentum touch scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0c0a09;
    }
    ::-webkit-scrollbar-thumb {
      background: #292524;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }
    /* Modal Animation */
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate {
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- ==================== PASSWORD LOGIN SCREEN ==================== -->
  <div id="pinLockScreen" class="fixed inset-0 z-50 bg-stone-950 flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-sm glass-panel p-6 sm:p-8 rounded-3xl border border-amber-500/20 shadow-2xl flex flex-col items-center text-center">
      
      <!-- Brand Logo -->
      <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-amber-500/40 p-0.5 bg-stone-900 shadow-lg shadow-amber-500/10 mb-4">
        <img src="logo.jpg" alt="Шамс" class="w-full h-full object-contain rounded-full" />
      </div>

      <h1 class="text-xl font-black text-white mb-1" id="pinTitle">Панель управления «Шамс»</h1>
      <p class="text-xs text-stone-400 mb-6" id="pinSubtitle">Введите пароль для входа в управление меню</p>

      <!-- Password Login Form (Manual typing with mobile or keyboard) -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="w-full flex flex-col gap-3">
        <!-- Input Group with Eye Toggle -->
        <div class="relative w-full">
          <input 
            type="password" 
            id="passwordInput" 
            autocomplete="current-password"
            placeholder="Введите пароль..." 
            class="w-full h-12 px-4 pe-11 rounded-2xl bg-stone-900/90 border border-stone-800 focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 text-white placeholder-stone-500 text-sm font-medium outline-none transition"
            required
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute inset-y-0 end-0 pe-3.5 flex items-center text-stone-400 hover:text-amber-400 transition cursor-pointer"
            tabindex="-1"
            title="Показать/скрыть пароль"
          >
            <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>

        <!-- Error / Status Message Box -->
        <div id="pinError" class="text-xs font-semibold min-h-[20px] px-3 py-2 rounded-2xl text-center hidden transition-all duration-300">
          Неверный пароль!
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="btnLoginSubmit" 
          class="w-full h-12 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-stone-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 active:scale-[0.98] transition cursor-pointer"
        >
          <span id="btnLoginText">Войти в панель</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-xs" id="loginBtnIcon"></i>
        </button>
      </form>

      <!-- Lang toggle on lock screen -->
      <div class="mt-6 flex items-center gap-2 text-xs">
        <button type="button" id="lockLangRu" onclick="switchLang('ru')" class="px-3.5 py-1.5 rounded-full bg-stone-900 border border-stone-800 text-stone-400 font-bold hover:text-white transition">Русский</button>
        <button type="button" id="lockLangAr" onclick="switchLang('ar')" class="px-3.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-black shadow transition">العربية</button>
      </div>

    </div>
  </div>

  <!-- ==================== MAIN ADMIN APPLICATION ==================== -->
  <div id="adminApp" class="hidden flex-1 flex flex-col pb-28">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-30 glass-panel border-b border-white/10 px-3 sm:px-4 py-2 sm:py-3 pt-safe">
      <div class="container mx-auto max-w-6xl flex items-center justify-between gap-2 sm:gap-3">
        
        <!-- Brand & Title -->
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full overflow-hidden border border-amber-500/30 p-0.5 bg-stone-900 shrink-0">
            <img src="logo.jpg" alt="Логотип" class="w-full h-full object-contain rounded-full" />
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-black text-white text-xs sm:text-base tracking-tight truncate" id="headerTitle">ШАМС • Управление</span>
              <span class="hidden md:inline-block px-1.5 py-0.5 rounded-md bg-amber-500/10 text-amber-400 text-[9px] font-black border border-amber-500/20">ADMIN</span>
            </div>
            <span class="text-[10px] text-stone-400 hidden xs:block -mt-0.5 truncate" id="headerSub">Онлайн-меню и цены</span>
          </div>
        </div>

        <!-- Actions: Live Store, Language, Logout -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- View Live Store -->
          <a href="index.html" target="_blank" class="h-8 sm:h-9 px-2 sm:px-3 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold transition flex items-center justify-center gap-1.5 active:scale-95 whitespace-nowrap" title="المتجر">
            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            <span class="hidden sm:inline" id="btnLiveStore">Сайт</span>
          </a>

          <!-- Language Toggle (Never wraps, sleek pill) -->
          <button onclick="toggleLang()" class="h-8 sm:h-9 px-2.5 sm:px-3 rounded-xl bg-stone-900 border border-stone-800 hover:border-amber-500/40 text-[11px] sm:text-xs font-bold text-stone-200 hover:text-white transition whitespace-nowrap active:scale-95 flex items-center gap-1.5 shadow-sm cursor-pointer" id="langSwitchBtn" title="تغيير اللغة / Сменить язык">
            <i class="fa-solid fa-globe text-amber-400 text-xs"></i>
            <span id="langSwitchText">Русский</span>
          </button>

          <!-- Logout -->
          <button onclick="adminLogout()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-stone-900 border border-stone-800 hover:bg-red-500/20 hover:text-red-400 text-stone-400 flex items-center justify-center transition active:scale-95 shrink-0" title="Выйти">
            <i class="fa-solid fa-right-from-bracket text-xs"></i>
          </button>
        </div>

      </div>
    </header>

    <!-- Content Container -->
    <main class="container mx-auto max-w-6xl px-4 pt-4 flex-1">

      <!-- ==================== STATS ROW ==================== -->
      <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-3 sm:mb-4">
        <!-- Total Dishes -->
        <div class="glass-card p-2.5 sm:p-4 rounded-xl sm:rounded-2xl border border-white/5 flex flex-col justify-between">
          <span class="text-[10px] sm:text-xs text-stone-400 font-bold truncate" id="statDishesLabel">Всего блюд</span>
          <div class="flex items-baseline gap-1.5 mt-0.5 sm:mt-1">
            <span id="statDishesCount" class="text-lg sm:text-2xl font-black text-amber-400">65</span>
            <span id="statDishesUnit" class="text-[9px] sm:text-[10px] text-stone-500 font-bold">поز.</span>
          </div>
        </div>

        <!-- Categories -->
        <div class="glass-card p-2.5 sm:p-4 rounded-xl sm:rounded-2xl border border-white/5 flex flex-col justify-between">
          <span class="text-[10px] sm:text-xs text-stone-400 font-bold truncate" id="statCatsLabel">Категории</span>
          <div class="flex items-baseline gap-1.5 mt-0.5 sm:mt-1">
            <span class="text-lg sm:text-2xl font-black text-white">6</span>
            <span class="text-[9px] sm:text-[10px] text-stone-500 font-bold truncate" id="statCatsSub">разделов</span>
          </div>
        </div>

        <!-- Out of Stock -->
        <div class="glass-card p-2.5 sm:p-4 rounded-xl sm:rounded-2xl border border-white/5 flex flex-col justify-between">
          <span class="text-[10px] sm:text-xs text-stone-400 font-bold truncate" id="statOosLabel">Закончилось</span>
          <div class="flex items-baseline gap-1.5 mt-0.5 sm:mt-1">
            <span id="statOosCount" class="text-lg sm:text-2xl font-black text-red-400">0</span>
            <span class="text-[9px] sm:text-[10px] text-stone-500 font-bold truncate" id="statOosSub">нет в наличии</span>
          </div>
        </div>
      </div>

      <!-- ==================== SEARCH & ACTION BAR ==================== -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 sm:gap-3 mb-3 sm:mb-4">
        <!-- Search Input with RTL/LTR logical placement -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute start-3.5 top-1/2 -translate-y-1/2 text-stone-500 text-xs pointer-events-none"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Поиск по названию блюда или номеру..." 
            oninput="handleSearch(this.value)"
            class="w-full bg-stone-900/90 border border-stone-800 rounded-xl ps-9 pe-9 py-2.5 text-xs sm:text-sm text-white placeholder-stone-500 focus:outline-none focus:border-amber-500 transition" 
          />
          <button id="clearSearchBtn" onclick="clearSearch()" class="absolute end-3 top-1/2 -translate-y-1/2 text-stone-500 hover:text-white text-xs hidden p-1">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Add Dish Button (Prominent Gold) -->
        <button onclick="openAddModal()" class="flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-stone-950 font-black px-4 py-2.5 rounded-xl shadow-lg shadow-amber-500/20 active:scale-95 transition text-xs sm:text-sm shrink-0 min-h-[42px]">
          <i class="fa-solid fa-plus text-sm"></i>
          <span id="btnAddDish">Добавить блюдо</span>
        </button>
      </div>

      <!-- ==================== CATEGORY FILTER PILLS ==================== -->
      <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto pb-2 mb-3 sm:mb-4 no-scrollbar">
        <button onclick="setCategoryFilter('all')" id="cat-btn-all" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-stone-950 shadow-md shrink-0 transition">
          <span id="cat-btn-all-label">Все</span> (<span id="count-all">65</span>)
        </button>
        <button onclick="setCategoryFilter('shawarma')" id="cat-btn-shawarma" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-stone-900 border border-stone-800 text-stone-400 hover:text-white shrink-0 transition">
          <span id="cat-btn-shawarma-label">Шаверма</span> (<span id="count-shawarma">31</span>)
        </button>
        <button onclick="setCategoryFilter('boxes')" id="cat-btn-boxes" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-stone-900 border border-stone-800 text-stone-400 hover:text-white shrink-0 transition">
          <span id="cat-btn-boxes-label">Боксы</span> (<span id="count-boxes">11</span>)
        </button>
        <button onclick="setCategoryFilter('falafel')" id="cat-btn-falafel" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-stone-900 border border-stone-800 text-stone-400 hover:text-white shrink-0 transition">
          <span id="cat-btn-falafel-label">Фалафель</span> (<span id="count-falafel">3</span>)
        </button>
        <button onclick="setCategoryFilter('burgers')" id="cat-btn-burgers" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-stone-900 border border-stone-800 text-stone-400 hover:text-white shrink-0 transition">
          <span id="cat-btn-burgers-label">Бургеры</span> (<span id="count-burgers">5</span>)
        </button>
        <button onclick="setCategoryFilter('hotdog')" id="cat-btn-hotdog" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-stone-900 border border-stone-800 text-stone-400 hover:text-white shrink-0 transition">
          <span id="cat-btn-hotdog-label">Хот-доги</span> (<span id="count-hotdog">4</span>)
        </button>
        <button onclick="setCategoryFilter('drinks_sauces')" id="cat-btn-drinks_sauces" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-stone-900 border border-stone-800 text-stone-400 hover:text-white shrink-0 transition">
          <span id="cat-btn-drinks_sauces-label">Напитки и соусы</span> (<span id="count-drinks_sauces">11</span>)
        </button>
      </div>

      <!-- ==================== DISHES GRID ==================== -->
      <div id="dishesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3 sm:gap-4">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden py-16 text-center text-stone-500">
        <i class="fa-solid fa-burger text-4xl mb-3 opacity-40"></i>
        <p class="text-sm font-bold" id="emptyStateText">Блюда не найдены</p>
      </div>

    </main>

    <!-- Bottom Sticky Status / Save Bar -->
    <div id="unsavedBar" class="fixed bottom-[max(0.75rem,env(safe-area-inset-bottom,12px))] left-3 right-3 z-40 max-w-xl mx-auto glass-panel border border-amber-500/40 p-3 rounded-2xl shadow-2xl flex items-center justify-between gap-3 hidden animate-bounce-short">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span class="text-xs font-black text-amber-300" id="unsavedText">Есть несохраненные изменения!</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="discardChanges()" class="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-xs font-bold text-stone-300 transition" id="btnDiscard">
          Отмена
        </button>
        <button onclick="saveAllToServer()" class="px-4 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-black text-xs transition shadow-md shadow-amber-500/20" id="btnSaveAll">
          <i class="fa-solid fa-floppy-disk mr-1"></i> Сохранить
        </button>
      </div>
    </div>

  </div>

  <!-- ==================== EDIT / ADD DISH MODAL ==================== -->
  <div id="dishModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-2.5 sm:p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl sm:rounded-3xl border border-white/10 shadow-2xl flex flex-col max-h-[92dvh] sm:max-h-[88vh] overflow-hidden modal-animate">
      
      <!-- Modal Header -->
      <div class="px-4 sm:px-5 py-3.5 sm:py-4 border-b border-white/10 flex items-center justify-between">
        <h2 class="text-sm sm:text-base font-black text-white" id="modalTitle">➕ إضافة طبق جديد</h2>
        <button onclick="closeDishModal()" class="w-8 h-8 rounded-full bg-stone-800 text-stone-400 hover:text-white flex items-center justify-center transition active:scale-95">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-4 sm:p-5 overflow-y-auto space-y-3 sm:space-y-4 text-xs">

        <!-- Photo Upload (Gallery & Camera) -->
        <div class="flex items-center gap-3">
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl overflow-hidden bg-stone-900 border border-stone-700 shrink-0 relative group cursor-pointer shadow-md" onclick="document.getElementById('modalPhotoGallery').click()" title="تغيير الصورة">
            <img id="modalPhotoPreview" src="hero_dish.jpg" alt="معاينة الصورة" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
              <i class="fa-solid fa-images text-white text-sm"></i>
            </div>
          </div>
          <div class="flex-1 space-y-1.5">
            <!-- Hidden File Inputs -->
            <input type="file" id="modalPhotoGallery" accept="image/*" onchange="handleImagePick(this)" class="hidden" />
            <input type="file" id="modalPhotoCamera" accept="image/*" capture="environment" onchange="handleImagePick(this)" class="hidden" />
            <input type="hidden" id="modalPhotoUrl" value="hero_dish.jpg" />

            <!-- Gallery & Camera Action Buttons -->
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="document.getElementById('modalPhotoGallery').click()" class="py-2 sm:py-2.5 px-2.5 sm:px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-95 shadow-sm min-h-[40px]">
                <i class="fa-solid fa-images text-amber-400"></i>
                <span id="btnPickGallery">معرض الصور</span>
              </button>
              <button type="button" onclick="document.getElementById('modalPhotoCamera').click()" class="py-2 sm:py-2.5 px-2.5 sm:px-3 rounded-xl bg-stone-800 hover:bg-stone-700 border border-stone-700 text-stone-300 font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-95 min-h-[40px]">
                <i class="fa-solid fa-camera text-stone-400"></i>
                <span id="btnPickCamera">الكاميرا</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Russian Title -->
        <div>
          <label class="block font-bold text-stone-300 mb-1 flex items-center justify-between" id="lblTitleRu">
            <span class="lbl-text">اسم الطبق بالروسية *</span>
            <span class="text-[10px] text-amber-400 font-normal lbl-badge">✨ يترجم تلقائياً للعربية والإنجليزية</span>
          </label>
          <input type="text" id="modalTitleRu" required placeholder="Например: Шаверма Классик" dir="ltr" class="w-full bg-stone-900 border border-stone-800 rounded-xl px-3 py-2.5 text-white font-bold focus:outline-none focus:border-amber-500 text-sm text-left" />
        </div>

        <!-- Hidden Title translations (auto-filled on save) -->
        <input type="hidden" id="modalTitleAr" />
        <input type="hidden" id="modalTitleEn" />

        <!-- Category + Price + Volume (compact row) -->
        <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
          <div>
            <label class="block font-bold text-stone-400 mb-1 text-[11px]" id="lblCategory">القسم</label>
            <select id="modalCategory" class="w-full bg-stone-900 border border-stone-800 rounded-xl px-2 py-2.5 text-white focus:outline-none focus:border-amber-500 font-bold cursor-pointer text-[11px] sm:text-xs">
              <option value="shawarma">🌯 شاورما</option>
              <option value="boxes">📦 بوكسات</option>
              <option value="falafel">🧆 فلافل</option>
              <option value="burgers">🍔 برجر</option>
              <option value="hotdog">🌭 هوت دوج</option>
              <option value="drinks_sauces">🥤 مشروبات</option>
            </select>
          </div>
          <div>

    // --- Cryptographic Authentication & Session Security ---
    const AUTH_SALT = 'shams_spb_secure_salt_2026';
    const AUTHORIZED_HASHES = [
      'a8c5353f13fce3451c07ff8f7a4d6c6a4f71d24ee922823908823f30600bda84',
      '721286aa20f4972f4d9426f66dc629ac96a1110aa3651722a822de55a3cee4d8'
    ];

    async function hashAdminPassword(pwd) {
      if (!window.crypto || !window.crypto.subtle) return '';
      const enc = new TextEncoder();
      const buf = await window.crypto.subtle.digest('SHA-256', enc.encode(pwd + AUTH_SALT));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function generateSecureSessionToken() {
      const arr = new Uint8Array(24);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(arr);
      } else {
        for (let i = 0; i < 24; i++) arr[i] = Math.floor(Math.random() * 256);
      }
      const randomHex = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
      const expiresAt = Date.now() + (24 * 60 * 60 * 1000); // 24 hours
      return `shams_sec_${randomHex}_${expiresAt}`;
    }

    function isSessionValid(token) {
      if (!token || typeof token !== 'string') return false;
      if (!token.startsWith('shams_sec_')) return false;
      const parts = token.split('_');
      if (parts.length < 4) return false;
      const exp = parseInt(parts[parts.length - 1], 10);
      return !isNaN(exp) && exp > Date.now();
    }

    function getAuthToken() {
      return sessionStorage.getItem('shams_admin_token') || '';
    }

    async function authFetch(url, options = {}) {
      const token = getAuthToken();
      options.headers = options.headers || {};
      if (token) {
        options.headers['Authorization'] = 'Bearer ' + token;
      }
      const res = await fetch(url, options);
      if (res.status === 401) {
        sessionStorage.removeItem('shams_admin_token');
        showLoginScreen();
        showToast(currentLang === 'ru' ? 'Сессия истекла. Войдите снова.' : 'انتهت الجلسة. يرجى تسجيل الدخول مجدداً.');
      }
      return res;
    }

    async function checkAuth() {
      const token = getAuthToken();
      if (!token || !isSessionValid(token)) {
        sessionStorage.removeItem('shams_admin_token');
        showLoginScreen();
        return;
      }

      hideLoginScreen();
      loadDishes();

    let lockoutTimer = null;
    let lockoutRemainingSeconds = 0;

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderLockoutUI() {
      const errEl = document.getElementById('pinError');
      if (!errEl) return;
      const isAr = currentLang === 'ar';
      const timeStr = formatTime(lockoutRemainingSeconds);

      errEl.className = 'w-full text-xs font-semibold px-3 py-2.5 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-300 flex flex-col items-center gap-1.5 shadow-lg shadow-amber-500/5 transition-all duration-300';
      errEl.classList.remove('hidden');

      errEl.innerHTML = `
        <div class="flex items-center gap-1.5 font-bold text-amber-400">
          <i class="fa-solid fa-hourglass-half text-xs animate-pulse"></i>
          <span>${isAr ? 'تم حظر المحاولات مؤقتاً' : 'Временная блокировка'}</span>
        </div>
        <div class="text-[11px] text-stone-300 text-center">
          ${isAr ? 'استنفدت 5 محاولات خاطئة. المحاولة متاحة بعد:' : 'Превышен лимит 5 попыток. Повторите через:'}
        </div>
        <div class="font-mono text-base font-black text-amber-400 bg-stone-900/90 px-3 py-0.5 rounded-xl border border-amber-500/40 shadow-inner tracking-wider">
          ${timeStr}
        </div>
      `;
    }

    function startLockoutCountdown(seconds) {
      if (lockoutTimer) clearInterval(lockoutTimer);
      lockoutRemainingSeconds = Math.max(1, Math.round(seconds));

      const input = document.getElementById('passwordInput');
      const btn = document.getElementById('btnLoginSubmit');
      if (input) {
        input.disabled = true;
        input.classList.add('opacity-50', 'cursor-not-allowed');
      }
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
      }

      renderLockoutUI();

      lockoutTimer = setInterval(() => {
        lockoutRemainingSeconds--;
        if (lockoutRemainingSeconds <= 0) {
          clearInterval(lockoutTimer);
          lockoutTimer = null;
          lockoutRemainingSeconds = 0;
          localStorage.removeItem('shams_lockout_until');

          if (input) {
            input.disabled = false;
            input.classList.remove('opacity-50', 'cursor-not-allowed');
            input.value = '';
            input.focus();
          }
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
          }

          const errEl = document.getElementById('pinError');
          if (errEl) {
            errEl.className = 'w-full text-xs font-bold text-emerald-400 bg-emerald-500/15 border border-emerald-500/30 px-3 py-2 rounded-2xl text-center transition-all duration-300';
            errEl.innerHTML = `
              <div class="flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-circle-check"></i>
                <span>${currentLang === 'ar' ? 'انتهت مدة الحظر المؤقت! يمكنك المحاولة الآن.' : 'Блокировка снята! Вы можете попробовать снова.'}</span>
              </div>
            `;
            setTimeout(() => {
              if (!lockoutTimer) {
                errEl.classList.add('hidden');
                errEl.innerHTML = '';
              }
            }, 6000);
          }
        } else {
          renderLockoutUI();
        }
      }, 1000);
    }

    async function showLoginScreen() {
      const screen = document.getElementById('pinLockScreen');
      if (screen) screen.classList.remove('hidden');
      const input = document.getElementById('passwordInput');
      if (input && !lockoutTimer) {
        input.value = '';
        setTimeout(() => input.focus(), 150);
      }

      // 1. Proactively check local lockout
      const localLockout = parseInt(localStorage.getItem('shams_lockout_until') || '0', 10);
      const now = Date.now();
      if (localLockout > now) {
        startLockoutCountdown(Math.ceil((localLockout - now) / 1000));
        return;
      }

      // 2. Proactively check server lockout
      try {
        const res = await fetch('/api/auth/lockout');
        if (res.ok) {
          const data = await res.json();
          if (data.locked && data.remainingSeconds > 0) {
            startLockoutCountdown(data.remainingSeconds);
          }
        }
      } catch (e) {
        // silent
      }
    }

    function hideLoginScreen() {
      const screen = document.getElementById('pinLockScreen');
      if (screen) screen.classList.add('hidden');
      const app = document.getElementById('adminApp');
      if (app) app.classList.remove('hidden');
    }

    function showLoginScreen() {
      const screen = document.getElementById('pinLockScreen');
      if (screen) screen.classList.remove('hidden');
      const app = document.getElementById('adminApp');
      if (app) app.classList.add('hidden');
      const input = document.getElementById('passwordInput');
      if (input) {
        input.value = '';
        input.focus();

    }

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-sm text-amber-400';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-sm text-stone-400';
      }
    }

    function renderWrongPasswordUI(remaining, total) {
      const errEl = document.getElementById('pinError');
      const input = document.getElementById('passwordInput');
      const isAr = currentLang === 'ar';

      if (errEl) {
        errEl.className = 'w-full text-xs font-semibold text-red-300 bg-red-500/15 border border-red-500/30 px-3 py-2 rounded-2xl text-center';
        errEl.classList.remove('hidden');
        errEl.innerHTML = `
          <div class="flex items-center justify-center gap-1.5 font-bold text-red-400">
            <i class="fa-solid fa-circle-xmark"></i>
            <span>${isAr ? 'كلمة المرور غير صحيحة!' : 'Неверный пароль!'}</span>
          </div>
          <div class="text-[11px] text-stone-300 mt-1">
            ${isAr 
              ? `متبقي <strong class="text-amber-400 font-bold text-xs">${remaining}</strong> من أصل ${total} محاولات`
              : `Осталось попыток: <strong class="text-amber-400 font-bold text-xs">${remaining}</strong> из ${total}`}
          </div>
        `;
      }

      if (input) {
        input.classList.add('border-red-500', 'ring-2', 'ring-red-500/30');
        setTimeout(() => input.classList.remove('border-red-500', 'ring-2', 'ring-red-500/30'), 1500);
        input.focus();
        input.select();
      }
    }

    async function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      if (lockoutTimer) return;

      const input = document.getElementById('passwordInput');
      const password = (input ? input.value : '').trim();
      const errEl = document.getElementById('pinError');
      const btn = document.getElementById('btnLoginSubmit');
      const btnText = document.getElementById('btnLoginText');
      const btnIcon = document.getElementById('loginBtnIcon');
      const originalText = btnText ? btnText.textContent : '';

      // Check local lockout timer
      const localLockout = parseInt(localStorage.getItem('shams_lockout_until') || '0', 10);
      const now = Date.now();
      if (localLockout > now) {
        startLockoutCountdown(Math.ceil((localLockout - now) / 1000));
        return;
      }

      if (!password) {
        errEl.className = 'w-full text-xs font-bold text-red-400 bg-red-500/15 border border-red-500/30 px-3 py-2 rounded-2xl text-center';
        errEl.classList.remove('hidden');
        errEl.innerHTML = `
          <div class="flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>${currentLang === 'ru' ? 'Введите пароль!' : 'يرجى إدخال كلمة المرور!'}</span>
          </div>
        `;
        if (input) input.focus();
        return;
      }

      errEl.classList.add('hidden');
      if (btn) btn.disabled = true;
      if (btnText) btnText.textContent = currentLang === 'ru' ? 'Проверка...' : 'جاري التحقق...';
      if (btnIcon) btnIcon.className = 'fa-solid fa-spinner fa-spin text-xs';

      let serverResponded = false;

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data && data.success && data.token) {
            serverResponded = true;
            if (lockoutTimer) {
              clearInterval(lockoutTimer);
              lockoutTimer = null;
            }
            localStorage.removeItem('shams_failed_attempts');
            localStorage.removeItem('shams_lockout_until');
            sessionStorage.setItem('shams_admin_token', data.token);
            hideLoginScreen();
            loadDishes();
            showToast(currentLang === 'ru' ? 'Добро пожаловать в панель «Шамс»!' : 'أهلاً بك في لوحة تحكم «شمس»! ✨');
            return;
          }
        } else if (res.status === 429) {
          serverResponded = true;
          const data = await res.json();
          const secs = data.remainingSeconds || (15 * 60);
          startLockoutCountdown(secs);
          return;
        } else if (res.status === 401) {
          serverResponded = true;
          const data = await res.json();
          const remaining = data.remaining !== undefined ? data.remaining : 4;
          const total = data.maxAttempts || 5;
          renderWrongPasswordUI(remaining, total);
          return;
        }
      } catch (err) {
        // Fetch failed (network error, offline, or 404 HTML on static host like Vercel)
        serverResponded = false;
      }

      // Cryptographic Zero-Knowledge Verification (Zero plaintext passwords)
      if (!serverResponded) {
        const inputHash = await hashAdminPassword(password);
        if (AUTHORIZED_HASHES.includes(inputHash)) {
          if (lockoutTimer) {
            clearInterval(lockoutTimer);
            lockoutTimer = null;
          }
          localStorage.removeItem('shams_failed_attempts');
          localStorage.removeItem('shams_lockout_until');
          sessionStorage.setItem('shams_admin_token', generateSecureSessionToken());
          hideLoginScreen();
          loadDishes();
          showToast(currentLang === 'ru' ? 'Добро пожаловать в панель «Шамс»!' : 'أهلاً بك في لوحة تحكم «شمس»! ✨');
        } else {
          let attempts = parseInt(localStorage.getItem('shams_failed_attempts') || '0', 10) + 1;
          localStorage.setItem('shams_failed_attempts', attempts);

          if (attempts >= 5) {
            const lockoutDuration = 15 * 60; // 15 mins
            localStorage.setItem('shams_lockout_until', Date.now() + (lockoutDuration * 1000));
            localStorage.removeItem('shams_failed_attempts');
            startLockoutCountdown(lockoutDuration);
          } else {
            const remaining = 5 - attempts;
            renderWrongPasswordUI(remaining, 5);
          }
        }
      }

      if (!lockoutTimer) {
        if (btn) btn.disabled = false;
        if (btnText) btnText.textContent = originalText;
        if (btnIcon) btnIcon.className = 'fa-solid fa-arrow-right-to-bracket text-xs';
      }
    }

    function adminLogout() {
      sessionStorage.removeItem('shams_admin_token');
      showLoginScreen();
    }

    // --- Load Dishes ---
    async function loadDishes() {
      // 1. First priority: Cloud Firestore (cloud source of truth)
      if (firestoreDb) {
        try {
          const doc = await firestoreDb.collection('settings').doc('menu').get();
          if (doc.exists) {
            const data = doc.data();
            if (data && Array.isArray(data.dishes) && data.dishes.length > 0) {
              dishesList = data.dishes;
              renderAll();
              return;
            }
          } else {
            // First-time setup: automatically seed Firestore with default dishes!
            const defaultDishes = (window.SHAMS_MENU && Array.isArray(window.SHAMS_MENU)) ? window.SHAMS_MENU : [];
            if (defaultDishes.length > 0) {
              dishesList = JSON.parse(JSON.stringify(defaultDishes));
              firestoreDb.collection('settings').doc('menu').set({
                dishes: dishesList,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              }).catch(e => console.warn('Auto-seed error:', e));
              renderAll();
              return;
            }
          }
        } catch (e) {
          console.warn('Firestore load failed, falling back:', e);
        }
      }

      // 2. Try local customized dishes saved on this device
      try {
        const rawLocal = localStorage.getItem('shams_custom_dishes');
        if (rawLocal) {
          const parsed = JSON.parse(rawLocal);
          if (Array.isArray(parsed) && parsed.length > 0) {
            dishesList = parsed;
            renderAll();
            return;
          }
        }
      } catch (e) {}

      // 3. Try fetching clean_dishes.json (static file)
      try {
        const res = await fetch('clean_dishes.json');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            dishesList = data;
            renderAll();
            return;
          }
        }
      } catch (e) {}

      // 4. Fallback to window.SHAMS_MENU from dishes.js
      if (window.SHAMS_MENU && Array.isArray(window.SHAMS_MENU) && window.SHAMS_MENU.length > 0) {
        dishesList = JSON.parse(JSON.stringify(window.SHAMS_MENU));
      }
      renderAll();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderDishes() {
      const grid = document.getElementById('dishesGrid');
      const empty = document.getElementById('emptyState');

      const filtered = dishesList.filter(dish => {
        // Category match
        if (activeCategory !== 'all' && dish.category !== activeCategory) {
          return false;
        }
        // Search match
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          const titleRu = (dish.title?.ru || '').toLowerCase();
          const titleAr = (dish.title?.ar || '').toLowerCase();
          const titleEn = (dish.title?.en || '').toLowerCase();
          const idStr = String(dish.id);
          return titleRu.includes(q) || titleAr.includes(q) || titleEn.includes(q) || idStr === q;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      grid.innerHTML = filtered.map(dish => {
        const isOos = dish.outOfStock === true;
        const isAr = currentLang === 'ar';
        const title = isAr ? (dish.title?.ar || dish.title?.ru) : (dish.title?.ru || dish.title?.ar);
        
        // Localized category badge & subtitle
        const catName = (i18n[currentLang].cats && i18n[currentLang].cats[dish.category]) || dish.category;
        const subTitle = isAr ? `قسم ${catName}` : (dish.title?.ar || '');

        // Volume localization: 380 г -> 380 جم
        let formattedVolume = dish.volume || '';
        if (isAr && formattedVolume) {
          formattedVolume = formattedVolume.replace(/г/g, 'جم').replace(/мл/g, 'مل').replace(/л/g, 'لتر');
        }

        const safeTitle = escapeHtml(title);
        const safeSubTitle = escapeHtml(subTitle);
        const safePhoto = escapeHtml(dish.photo || 'hero_dish.jpg');
        const safeVolume = escapeHtml(formattedVolume);

        const statusClass = isOos 
          ? 'bg-red-500/15 text-red-400 border-red-500/30' 
          : 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30';
        const statusText = isOos 
          ? (i18n[currentLang].outStockBadge) 
          : (i18n[currentLang].inStockBadge);

        return `
          <div class="glass-card rounded-2xl p-3.5 flex flex-col justify-between relative group ${isOos ? 'opacity-70 border-red-500/20' : ''}">
            
            <!-- Card Top: Image + Info -->
            <div class="flex items-start gap-3">
              <!-- Dish Thumbnail -->
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden bg-stone-900 border border-stone-800 shrink-0 relative">
                <img src="${safePhoto}" alt="${safeTitle}" class="w-full h-full object-cover" onerror="this.src='hero_dish.jpg'" />
                ${dish.popular ? '<span class="absolute top-1 left-1 bg-amber-500 text-stone-950 text-[9px] font-black px-1.5 py-0.5 rounded-md shadow">★</span>' : ''}
              </div>

              <!-- Main Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-1 mb-1">
                  <span class="text-[10px] text-stone-400 font-bold bg-stone-900 px-2 py-0.5 rounded-full border border-stone-800">#${dish.id} • ${safeVolume}</span>
                  
                  <!-- Out of Stock Toggle Button -->
                  <button onclick="toggleStock(${dish.id})" class="px-2 py-0.5 rounded-full text-[10px] font-black border transition active:scale-95 ${statusClass}">
                    ${statusText}
                  </button>
                </div>

                <h3 class="font-black text-white text-xs sm:text-sm leading-snug truncate" title="${safeTitle}">${safeTitle}</h3>
                ${safeSubTitle ? `<p class="text-[11px] text-amber-500/80 truncate font-bold font-sans">${safeSubTitle}</p>` : ''}
              </div>
            </div>

            <!-- Card Bottom: Price Editor + Actions -->
            <div class="mt-3 pt-3 border-t border-white/5 flex items-center justify-between gap-2">
              
              <!-- Quick Price Stepper -->
              <div class="flex items-center gap-1.5 bg-stone-900/90 border border-stone-800 rounded-xl px-2 py-1">

    // --- Interactive Operations & Cloud Sync ---
    async function syncDishesToCloud() {
      let cloudSaved = false;

      // 1. Save directly to Cloud Firestore!
      if (firestoreDb) {
        try {
          await firestoreDb.collection('settings').doc('menu').set({
            dishes: dishesList,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          cloudSaved = true;
        } catch (err) {
          console.error('Firestore save failed:', err);
          cloudSaved = false;
        }
      }

      // 2. Persist in localStorage for instant local preview
      try {
        localStorage.setItem('shams_custom_dishes', JSON.stringify(dishesList));
      } catch (e) {}

      if (cloudSaved) {
        hasUnsavedChanges = false;
        const unsavedBar = document.getElementById('unsavedBar');
        if (unsavedBar) unsavedBar.classList.add('hidden');
      }

      return cloudSaved;
    }

    let priceSaveTimeout = null;
    function stepPrice(id, delta) {
      const dish = dishesList.find(d => d.id === id);
      if (dish) {
        const newPrice = Math.max(10, dish.price + delta);
        if (newPrice !== dish.price) {
          dish.price = newPrice;
          renderDishes();
          clearTimeout(priceSaveTimeout);
          priceSaveTimeout = setTimeout(async () => {
            await syncDishesToCloud();
            showToast(currentLang === 'ru' ? 'Цена сохранена в облаке!' : 'تم حفظ السعر الجديد وتحديث المتجر! ✨');
          }, 600);
        }
      }
    }

    async function toggleStock(id) {
      const dish = dishesList.find(d => d.id === id);
      if (dish) {
        dish.outOfStock = !dish.outOfStock;
        renderAll();
        const saved = await syncDishesToCloud();
        if (saved) {
          showToast(currentLang === 'ru' ? 'Статус обновлен в облаке!' : 'تم تحديث حالة التوفر وحفظها فوراً! ✨');
        } else {
          markUnsaved();
        }
      }
    }

    async function deleteDish(id) {
      const msg = i18n[currentLang].deleteConfirm;
      if (confirm(msg)) {
        dishesList = dishesList.filter(d => d.id !== id);
        renderAll();
        showToast(currentLang === 'ru' ? 'Удаление...' : 'جاري حذف الطبق من المتجر...');
        const saved = await syncDishesToCloud();
        if (saved) {
          showToast(currentLang === 'ru' ? 'Блюдо удалено из меню! ✨' : 'تم حذف الطبق وتحديث المتجر فوراً! ✨');

        }

    }

    function downloadDishesJs(dishes) {
      const content = 'window.SHAMS_MENU = ' + JSON.stringify(dishes, null, 2) + ';\n';

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dishes.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

    async function triggerAutoTranslateIfEmpty() {
      let titleRu = document.getElementById('modalTitleRu').value.trim();
      let descRu = document.getElementById('modalDescRu').value.trim();
      let titleAr = document.getElementById('modalTitleAr').value.trim();
      let descAr = document.getElementById('modalDescAr').value.trim();

      // If one language is filled and the other is empty, auto-translate
      const needsTranslation = (titleRu && !titleAr) || (titleAr && !titleRu) || (descRu && !descAr) || (descAr && !descRu);
      if (needsTranslation) {
        try {
          const res = await authFetch('/api/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ titleRu, descRu, titleAr, descAr })
          });
          const data = await res.json();
          if (data.success) {
            if (!titleAr && data.titleAr) {
              document.getElementById('modalTitleAr').value = data.titleAr;
              document.getElementById('modalTitleAr').classList.add('ring-1', 'ring-amber-500');
              setTimeout(() => document.getElementById('modalTitleAr').classList.remove('ring-1', 'ring-amber-500'), 1500);
            }
            if (!titleRu && data.titleRu) {
              document.getElementById('modalTitleRu').value = data.titleRu;
              document.getElementById('modalTitleRu').classList.add('ring-1', 'ring-amber-500');
              setTimeout(() => document.getElementById('modalTitleRu').classList.remove('ring-1', 'ring-amber-500'), 1500);
            }
            if (!descAr && data.descAr) {
              document.getElementById('modalDescAr').value = data.descAr;
            }
            if (!descRu && data.descRu) {
              document.getElementById('modalDescRu').value = data.descRu;
            }
            if (data.titleEn) document.getElementById('modalTitleEn').value = data.titleEn;
            if (data.descEn) document.getElementById('modalDescEn').value = data.descEn;
          }
        } catch (e) {
          console.warn('Auto-translate on blur failed:', e);
        }
      }
    }

    function compressImage(file, maxWidth, maxHeight, quality, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxHeight) {
            if (width / height > maxWidth / maxHeight) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(compressedDataUrl);
        };
        img.onerror = () => {
          callback(e.target.result);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleImagePick(input) {
      const file = input.files[0];

        showToast(currentLang === 'ru' ? 'Обработка фото...' : 'جاري تجهيز ومعالجة الصورة...');
        compressImage(file, 640, 480, 0.78, async (compressedBase64) => {
          document.getElementById('modalPhotoPreview').src = compressedBase64;
          document.getElementById('modalPhotoUrl').value = compressedBase64;
          showToast(currentLang === 'ru' ? 'Фото успешно выбрано!' : 'تم اختيار صورة الطبق بنجاح!');
          input.value = '';

          // Try direct upload to server API if backend exists
          try {
            const res = await authFetch('/api/upload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ imageBase64: compressedBase64 })
            });
            if (res.ok) {
              const data = await res.json();
              if (data.success && data.photoPath) {
                document.getElementById('modalPhotoUrl').value = data.photoPath;
              }
            }
          } catch (err) {
            // Already set to compressedBase64 fallback
          }
        });
      }
    }

      let titleAr = document.getElementById('modalTitleAr').value.trim();
      const price = parseInt(document.getElementById('modalPrice').value, 10);

      if ((!titleRu && !titleAr) || isNaN(price) || price <= 0) {
        alert(currentLang === 'ru' ? 'Пожалуйста, укажите название и цену!' : 'يرجى إدخال اسم الطبق والسعر بشكل صحيح!');
        return;
      }

      const saveBtn = document.getElementById('btnModalSave');
      const saveBtnText = document.getElementById('btnModalSaveText');
      const originalText = saveBtnText ? saveBtnText.textContent : (currentLang === 'ru' ? 'Сохранить' : 'حفظ');
      if (saveBtn) saveBtn.disabled = true;
      if (saveBtnText) saveBtnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + (currentLang === 'ru' ? 'Сохраняем...' : 'جاري الحفظ والتحديث... ✨');

      try {
        const photoUrl = document.getElementById('modalPhotoUrl').value.trim() || 'hero_dish.jpg';
        let titleEn = document.getElementById('modalTitleEn').value.trim();
        const category = document.getElementById('modalCategory').value;
        const volume = document.getElementById('modalVolume').value.trim() || '350 г';
        let descRu = document.getElementById('modalDescRu').value.trim();
        let descAr = document.getElementById('modalDescAr').value.trim();
        let descEn = document.getElementById('modalDescEn').value.trim();
        const popular = document.getElementById('modalPopular').checked;
        const outOfStock = !document.getElementById('modalInStock').checked;

        // Automatically translate Russian title and description to Arabic and English on save if needed
        if (titleRu && (!titleAr || !titleEn || !descAr || !descEn)) {
          try {
            const res = await authFetch('/api/translate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ titleRu, descRu })
            });
            const data = await res.json();
            if (data.success) {
              if (data.titleAr && !titleAr) titleAr = data.titleAr;
              if (data.titleEn && !titleEn) titleEn = data.titleEn;
              if (data.descAr && !descAr) descAr = data.descAr;
              if (data.descEn && !descEn) descEn = data.descEn;
            }
          } catch (e) {
            console.warn('Auto translation fallback during save', e);
          }
        }

        if (!titleAr) titleAr = titleRu;
        if (!titleEn) titleEn = titleRu;
        if (!descAr) descAr = descRu;
        if (!descEn) descEn = descRu;

        if (currentEditingId !== null) {
          // Edit existing
          const dish = dishesList.find(d => d.id === currentEditingId);
          if (dish) {
            dish.title.ru = titleRu;
            dish.title.ar = titleAr;
            dish.title.en = titleEn;
            dish.price = price;
            dish.volume = volume;
            dish.category = category;
            dish.photo = photoUrl;
            dish.desc = dish.desc || {};
            dish.desc.ru = descRu;
            dish.desc.ar = descAr;
            dish.desc.en = descEn;
            dish.popular = popular;
            dish.outOfStock = outOfStock;
          }
        } else {
          // Add new
          const maxId = dishesList.reduce((max, d) => Math.max(max, d.id || 0), 0);
          const newDish = {
            id: maxId + 1,
            title: { ru: titleRu, ar: titleAr, en: titleEn },
            desc: { ru: descRu, ar: descAr, en: descEn },
            price: price,
            volume: volume,
            category: category,
            popular: popular,
            outOfStock: outOfStock,
            photo: photoUrl
          };
          dishesList.unshift(newDish); // Add at top
        }

        // Save directly to Cloud Firestore and LocalStorage!
        const saved = await syncDishesToCloud();

        renderAll();
        closeDishModal();

        const isAr = currentLang === 'ar';
        if (saved) {
          showToast(isAr ? 'تم حفظ الطبق وتحديث المتجر فوراً! ✨' : 'Блюдо сохранено в облаке и обновлено на сайте! ✨');
        } else {
          markUnsaved();
          showToast(isAr ? 'تم حفظ التعديل محلياً، اضغط حفظ بالأسفل للتأكيد' : 'Сохранено локально, нажмите Сохранить внизу');
        }
      } catch (err) {
        console.error('Error submitting dish modal:', err);
        alert(currentLang === 'ru' ? 'Ошибка при сохранении блюда' : 'حدث خطأ أثناء حفظ الطبق');
      } finally {
        if (saveBtn) saveBtn.disabled = false;
        if (saveBtnText) saveBtnText.textContent = originalText;
      }
    }

    // --- Toast Function ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    // --- Language Switching ---
    function toggleLang() {
      switchLang(currentLang === 'ru' ? 'ar' : 'ru');
    }

    function switchLang(lang) {
      currentLang = lang;
      const isAr = lang === 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.body.dir = isAr ? 'rtl' : 'ltr';

      const t = i18n[lang] || i18n.ar;

      // Helpers
      const setEl = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
      const setLblText = (id, txt) => {
        const el = document.getElementById(id);
        if (!el) return;
        const textSpan = el.querySelector('.lbl-text');
        if (textSpan) { textSpan.textContent = txt; }
        else { el.textContent = txt; }
      };

      // --- Dashboard elements ---
      setEl('pinTitle', t.pinTitle);
      setEl('pinSubtitle', t.pinSubtitle);
      const passInput = document.getElementById('passwordInput');
      if (passInput) passInput.placeholder = t.passPlaceholder;
      setEl('btnLoginText', t.btnLoginText);
      setEl('headerTitle', t.headerTitle);
      setEl('headerSub', t.headerSub);
      setEl('btnLiveStore', t.btnLiveStore);
      setEl('statDishesLabel', t.statDishesLabel);
      setEl('statCatsLabel', t.statCatsLabel);
      setEl('statCatsSub', t.statCatsSub);
      setEl('statOosLabel', t.statOosLabel);
      setEl('statOosSub', t.statOosSub);
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.placeholder = t.searchInput;
      setEl('btnAddDish', t.btnAddDish);
      setEl('emptyStateText', t.emptyStateText);
      setEl('unsavedText', t.unsavedText);
      setEl('btnDiscard', t.btnDiscard);
      setEl('btnSaveAll', t.btnSaveAll);

      // Language toggle button text & title
      setEl('langSwitchText', isAr ? 'Русский' : 'العربية');
      const langBtn = document.getElementById('langSwitchBtn');
      if (langBtn) langBtn.title = isAr ? 'التبديل إلى الروسية / Switch to Russian' : 'التبديل إلى العربية / Switch to Arabic';

      // Lock screen buttons styling
      const lockRu = document.getElementById('lockLangRu');
      const lockAr = document.getElementById('lockLangAr');
      if (lockRu && lockAr) {
        if (isAr) {
          lockAr.className = "px-3.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-black shadow transition";
          lockRu.className = "px-3.5 py-1.5 rounded-full bg-stone-900 border border-stone-800 text-stone-400 font-bold hover:text-white transition";
        } else {
          lockRu.className = "px-3.5 py-1.5 rounded-full bg-amber-500 text-stone-950 font-black shadow transition";
          lockAr.className = "px-3.5 py-1.5 rounded-full bg-stone-900 border border-stone-800 text-stone-400 font-bold hover:text-white transition";
        }
      }

      setLblText('lblTitleRu', isAr ? 'اسم الطبق *' : 'Название блюда (рус) *');
      setEl('lblCategory', isAr ? 'القسم' : 'Категория');
      setEl('lblPrice', isAr ? 'السعر ₽ *' : 'Цена ₽ *');
      setEl('lblVolume', isAr ? 'الوزن' : 'Вес');
      setLblText('lblDescRu', isAr ? 'وصف ومكونات الطبق' : 'Описание и состав (рус)');

      const badges = document.querySelectorAll('.lbl-badge');
      badges.forEach(b => { b.textContent = isAr ? '✨ يترجم تلقائياً للعربية والإنجليزية' : '✨ Автоперевод на арабский и английский'; });

      setEl('btnPickGallery', isAr ? 'معرض الصور' : 'Галерея');
      setEl('btnPickCamera', isAr ? 'الكاميرا' : 'Камера');
      setEl('lblPopular', isAr ? '⭐ مميز' : '⭐ Популярное');
      setEl('lblInStock', isAr ? '✅ متوفر' : '✅ В наличии');
      setEl('btnModalCancel', t.btnModalCancel);
      setEl('btnModalSaveText', isAr ? 'حفظ' : 'Сохранить');

      const pageTitle = document.getElementById('pageTitle');
      if (pageTitle) pageTitle.textContent = isAr ? 'لوحة إدارة قائمة الطعام • شمس СПб' : 'Панель управления меню • Шамс СПб';

      const catSelect = document.getElementById('modalCategory');
      if (catSelect && catSelect.options.length >= 6) {
        catSelect.options[0].text = isAr ? '🌯 شاورما' : '🌯 Шаверма';
        catSelect.options[1].text = isAr ? '📦 بوكسات' : '📦 Боксы';
        catSelect.options[2].text = isAr ? '🧆 فلافل' : '🧆 Фалафель';
        catSelect.options[3].text = isAr ? '🍔 برجر' : '🍔 Бургеры';
        catSelect.options[4].text = isAr ? '🌭 هوت دوج' : '🌭 Хот-доги';
        catSelect.options[5].text = isAr ? '🥤 مشروبات' : '🥤 Напитки';
      }
      localStorage.setItem('shams_admin_lang', lang);

      if (lockoutTimer && typeof renderLockoutUI === 'function') {
        renderLockoutUI();
      }

      renderAll();
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('shams_admin_lang') || 'ar';
      switchLang(savedLang);
      checkAuth();
    });
  </script>
</body>
</html>
